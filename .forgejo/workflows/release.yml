#
# Release builds, each file with a .sha256 next to it:
#   * a binary .deb + .tar.gz (CPack, cmake/Packaging.cmake) built in an
#     Ubuntu 26.04 container;
#   * a native Arch package (.pkg.tar.zst, packaging/arch/PKGBUILD) built in
#     an archlinux:base-devel container, also pushed to this owner's Arch
#     package registry (pacman repo, see README → Install).
#
#   * manual run (workflow_dispatch) → pick a version bump (patch/minor/major):
#       the version job runs scripts/version.sh (CMakeLists.txt +
#       package/metadata.json, CHANGELOG.md's [Unreleased] becomes [X.Y.Z]),
#       commits "release: vX.Y.Z", tags and pushes; the draft job creates a
#       draft release with the notes from the `## [X.Y.Z]` section of
#       CHANGELOG.md, both build jobs attach their packages to it, and the
#       publish job flips it live once both uploaded, pushes the Arch package
#       to the registry and starts mirror-gh-releases.yml (copies the release
#       to GitHub). Pick "build-only" to just build the packages as run
#       artifacts (no version change, no release).
#   * push a tag vX.Y.Z by hand (must equal the version in CMakeLists.txt)
#       → same path, no version bump.
#
# Setup:
#   * secret RELEASE_TOKEN (or CI_TOKEN), an owner token with
#     write:repository — the version job needs it to push to protected master;
#   * secret PACKAGE_TOKEN (user-level is fine), an owner token with
#     write:package + read:repository, for the Arch registry upload: it
#     downloads the package from the release (the run's own token counts as
#     anonymous on attachment downloads, which a private owner refuses) and
#     pushes it to the registry.
#
# The release API calls live in scripts/forgejo-release.sh. Forgejo swallows
# events pushed with the Actions token, so the version job's tag push starts no
# second run. If one ever appears (the owner-token tag fallback), the
# `concurrency: release` group queues it behind this one and it uploads nothing
# because the release is already published.
#
# The .deb links against Ubuntu 26.04's Qt/KF6 (its Depends pins the minimum
# versions), the Arch package against Arch's; other distros build from source
# (README → Install).
# Conventions (unqualified actions, Forgejo upload-artifact): see ci.yml.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for this release'
        type: choice
        default: patch
        options: [patch, minor, major, build-only]

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Arch registry group = the pacman repo name; see README → Install.
  ARCH_REPO_GROUP: apps

jobs:
  version:
    name: Bump version, tag
    if: github.event_name == 'workflow_dispatch' && inputs.bump != 'build-only'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      # persist-credentials: false — both pushes below carry their credential
      # explicitly, so the run token never sits in .git/config.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Bump version, commit, tag, push
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          # Must carry write:repository (a read-only token's push 403s).
          PUSH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.CI_TOKEN }}
          # The run-scoped Actions token, for the tag push (see below).
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::no RELEASE_TOKEN (or CI_TOKEN) secret — the version bump cannot be pushed to protected $GITHUB_REF_NAME"
            exit 1
          fi
          scripts/version.sh --check
          old=$(scripts/version.sh)
          new=$(scripts/version.sh "$BUMP")
          echo "bumping $old -> $new"
          repo_path="${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          owner_url="https://${PUSH_TOKEN}@${repo_path}"
          # The checkout carries no tags, so `git tag` below cannot notice a
          # v$new that already exists on the server: its push would be rejected
          # only after the release commit had landed on $GITHUB_REF_NAME.
          existing=$(git ls-remote --tags "$owner_url" "refs/tags/v$new")
          if [ -n "$existing" ]; then
            echo "::error::tag v$new already exists on the server — nothing was pushed"
            exit 1
          fi
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.localhost"
          git commit -am "release: v$new"
          git tag "v$new"
          # master is protected: the pre-receive hook declines the run-scoped
          # Actions token (forgejo#11159), so the branch push authenticates as
          # the repo owner. The tag goes through the Actions token: its push
          # events are swallowed, so no duplicate release run fires. If the
          # tag is declined too, retry as the owner (see the header note).
          actions_url="https://x-access-token:${ACTIONS_TOKEN}@${repo_path}"
          git push "$owner_url" "HEAD:$GITHUB_REF_NAME"
          git push "$actions_url" "v$new" \
            || git push "$owner_url" "v$new"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Creates the draft release both build jobs upload into, so they never race
  # to create it. Also the one place that checks tag == version.
  draft:
    name: Draft release
    needs: version
    # Run when version succeeded OR was skipped (tag push / build-only dispatch).
    if: ${{ !cancelled() && needs.version.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.rel.outputs.version }}
      tag: ${{ steps.rel.outputs.tag }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v6
        with:
          # On a bump run, read the tagged commit (not the pre-bump dispatch ref).
          ref: ${{ needs.version.outputs.tag || github.ref }}
          persist-credentials: false

      # tag is the tag this run publishes — empty means build-only.
      - name: Determine version and release tag
        id: rel
        env:
          BUMP_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          scripts/version.sh --check
          version=$(scripts/version.sh)
          if [ -n "$BUMP_TAG" ]; then
            tag=$BUMP_TAG
          # Only a tag push publishes its ref: a build-only dispatch started
          # on a tag ref must not release that tag.
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=
          fi
          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match CMakeLists.txt version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        if: steps.rel.outputs.tag != ''
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -eu
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::warning::CHANGELOG.md has no [$VERSION] section"
            echo "See [CHANGELOG.md](CHANGELOG.md)." > release-notes.md
          fi
          cat release-notes.md

      # Empty id = the release is already published (a re-run, or the tag-push
      # run from the header note): the build jobs then only build.
      - name: Find or create the draft release
        id: draft
        if: steps.rel.outputs.tag != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          TAG: ${{ steps.rel.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha || github.sha }}
        run: |
          set -eu
          id=$(scripts/forgejo-release.sh prepare "$TAG" "$SHA" release-notes.md)
          echo "release id: ${id:-none}"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  package:
    name: Build packages (Ubuntu 26.04)
    needs: [version, draft]
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      # Persistent apt download cache — see ci.yml's header.
      volumes:
        - /persistent/apt:/cache/apt
    env:
      DEBIAN_FRONTEND: noninteractive
      DISTRO: ubuntu26.04
      VERSION: ${{ needs.draft.outputs.version }}
      APT_ARCHIVES: /cache/apt/ubuntu26.04
    steps:
      - name: Install build deps (Node for the JavaScript actions)
        run: |
          set -eu
          rm -f /etc/apt/apt.conf.d/docker-clean
          # No fsync per unpacked file: the container is thrown away anyway, and
          # syncing made the 847-package full-upgrade take ~22 of the job's 30 min.
          echo force-unsafe-io > /etc/dpkg/dpkg.cfg.d/90unsafe-io
          mkdir -p "$APT_ARCHIVES/partial"
          printf 'Dir::Cache::Archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\n' \
            "$APT_ARCHIVES" > /etc/apt/apt.conf.d/90persistent-cache
          apt-get update
          # Queue behind other jobs on the shared archive cache — see the
          # same step in ci.yml.
          flock "$APT_ARCHIVES.lock" apt-get install -y --no-install-recommends \
            build-essential git ca-certificates curl jq nodejs dpkg-dev file \
            cmake extra-cmake-modules gettext \
            libkf6wallet-dev libkf6kcmutils-dev libkf6coreaddons-dev \
            libkf6i18n-dev libkf6package-dev libplasma-dev \
            qt6-webengine-dev qt6-webengine-dev-tools
          flock "$APT_ARCHIVES.lock" apt-get autoclean -qq

      - uses: actions/checkout@v6
        with:
          # On a bump run, build the tagged commit (not the pre-bump dispatch ref).
          ref: ${{ needs.version.outputs.tag || github.ref }}
          # The job never pushes; the release steps pass the token explicitly.
          persist-credentials: false

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF
          cmake --build build -j$(nproc)

      - name: Package
        run: |
          set -eu
          cpack --config build/CPackConfig.cmake -B build/cpack
          mkdir -p dist
          arch=$(dpkg --print-architecture)
          cp build/cpack/iframe-plasma_*.deb "dist/iframe-plasma_${VERSION}_${DISTRO}_${arch}.deb"
          cp build/cpack/iframe-plasma-*.tar.gz "dist/iframe-plasma-${VERSION}-${DISTRO}-${arch}.tar.gz"
          cd dist
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -l
          dpkg-deb -f *.deb Package Version Architecture Depends

      - name: Upload packages as run artifact
        uses: forgejo/upload-artifact@v5
        with:
          name: iframe-plasma-${{ env.VERSION }}-${{ env.DISTRO }}
          path: dist/

      - name: Upload packages to the draft release
        if: needs.draft.outputs.release_id != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
        run: scripts/forgejo-release.sh upload "${{ needs.draft.outputs.release_id }}" dist/*

  # Native Arch package, built with makepkg against Arch's own Qt/KF6 — see
  # packaging/arch/PKGBUILD + ci-build.sh. Runs in parallel with `package` and
  # uploads into the same draft. The image has no node until the artifact step
  # installs it, so checkout is a manual fetch instead of actions/checkout.
  arch:
    name: Build package (Arch Linux)
    needs: [version, draft]
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      # The token sits only on the fetch command line, never in .git/config.
      - name: Checkout
        env:
          GIT_REF: ${{ needs.version.outputs.tag || github.ref }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git
          git config --global --add safe.directory "$PWD"
          git init -q .
          git -c protocol.version=2 fetch --no-tags --prune --no-recurse-submodules --depth=1 \
            "https://x-access-token:${GIT_TOKEN}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" "$GIT_REF"
          git checkout -q --force FETCH_HEAD

      # Installs the build deps, then runs makepkg as an unprivileged user
      # (makepkg refuses root) and checks the plugin's install path.
      - name: Build the Arch package
        run: packaging/arch/ci-build.sh

      - name: Upload the package to the draft release
        if: needs.draft.outputs.release_id != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
        run: scripts/forgejo-release.sh upload "${{ needs.draft.outputs.release_id }}" packaging/arch/*.pkg.tar.zst packaging/arch/*.pkg.tar.zst.sha256

      # upload-artifact is a JavaScript action: the container needs node first.
      - name: Install node for upload-artifact
        run: pacman -S --noconfirm --needed nodejs

      - name: Upload the package as run artifact
        uses: forgejo/upload-artifact@v5
        with:
          name: iframe-plasma-${{ needs.draft.outputs.version }}-archlinux
          path: |
            packaging/arch/*.pkg.tar.zst
            packaging/arch/*.pkg.tar.zst.sha256

  # Flip the draft live once both builds uploaded — the release stays
  # invisible until it is complete.
  publish:
    name: Publish release
    needs: [draft, package, arch]
    if: ${{ !cancelled() && needs.draft.outputs.release_id != '' && needs.package.result == 'success' && needs.arch.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # The helper script comes from the release commit.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.draft.outputs.tag }}
          persist-credentials: false

      - name: Publish the Forgejo release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
        run: scripts/forgejo-release.sh publish "${{ needs.draft.outputs.release_id }}"

      # Forgejo emits no `release` event for releases created with the Actions
      # token, so start the GitHub release mirror explicitly. Non-fatal: its
      # scheduled reconcile catches up.
      - name: Trigger the GitHub release mirror
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # ref must be a branch carrying the workflow file; this run may be on a tag.
          curl -sS --fail-with-body -X POST -H "Authorization: token $TOKEN" \
            -H 'Content-Type: application/json' \
            "$GITHUB_API_URL/repos/$REPO/actions/workflows/mirror-gh-releases.yml/dispatches" \
            -d '{"ref":"master"}' \
            || echo "::warning::mirror-gh-releases dispatch failed — the scheduled reconcile will catch up"

      # Last, so a registry problem can't hold back the release itself; it
      # still fails the run. pacman clients pick the new version up on their
      # next `pacman -Syu`.
      - name: Push the Arch package to the package registry
        env:
          TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::no PACKAGE_TOKEN secret (owner token with write:package + read:repository) — the Arch package was not pushed to the registry"
            exit 1
          fi
          scripts/forgejo-release.sh arch-registry "${{ needs.draft.outputs.release_id }}" \
            "${{ github.repository_owner }}" "$ARCH_REPO_GROUP"
