#
# Forgejo Actions CI (forgejo.informethic.ch). GitHub is a push mirror only:
# no workflows run there.
#
# Instance conventions (same as the other repos on this instance):
#   * Actions are referenced unqualified (owner/repo@ref): DEFAULT_ACTIONS_URL
#     points at this instance, so they resolve against its local pull mirrors
#     (org `actions`, `forgejo`). Before bumping an @version, confirm the
#     mirror has synced that tag. Actions without a local mirror use a full
#     https:// URL.
#   * upload-artifact comes from the Forgejo fork: GitHub's v4+ refuses
#     non-github.com instances, so never use actions/upload-artifact here.
#   * Container jobs: the runner executes JavaScript actions with the job
#     container's own `node`, so a container without Node must install it
#     before the first `uses:` step (see build-and-test).
#   * Download/compile caches: per-tool directories under /persistent on
#     the runner's DinD host (SSD, survives the dind resets), shared by every
#     repo on this runner, mounted by build-and-test and release.yml:
#       /persistent/ccache     → /cache/ccache     ccache (CCACHE_DIR)
#       /persistent/apt        → /cache/apt        downloaded .debs, one
#                                                  subdirectory per distro
#     Node goes into /opt/hostedtoolcache in setup-node's layout
#     (node/<ver>/x64): the runner itself mounts its persistent tool cache
#     there in every job container, so it must NOT be listed under
#     `volumes:` again (duplicate mount point → the job dies before step 1).
#     Each mount must be listed in the runner config's container.valid_volumes, or
#     the mount is dropped with "[<path>] is not a valid volume, will be
#     ignored" and that cache is just empty (the first step warns). Writable
#     by every repo on this runner — accepted, all are the owner's. apt
#     verifies cached .debs against the signed indexes before installing.
name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # pre-commit lints (whitespace, REUSE/SPDX compliance, shellcheck,
  # cmake-lint). qmllint runs in build-and-test where Qt is available.
  # -------------------------------------------------------------------
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: https://github.com/actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  # -------------------------------------------------------------------
  # Build the C++ plugin + the test suite on Ubuntu 26.04 (Qt 6.10, KF6,
  # Plasma 6.6 — the distro the release .deb targets), then run every
  # CTest target headless.
  #
  # Previously kdeneon/plasma: that Docker Hub image is a ~2023 desktop
  # snapshot, so every run spent ~22 min in a full-upgrade of 847 packages
  # (kernels, firmware, initramfs, icon themes) before building.
  # -------------------------------------------------------------------
  build-and-test:
    name: Build + test (Ubuntu 26.04)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      options: --security-opt apparmor=unconfined
      volumes:
        - /persistent/ccache:/cache/ccache
        - /persistent/apt:/cache/apt
    env:
      QT_QPA_PLATFORM: offscreen
      # WebEngine can't use Chromium's setuid sandbox inside the
      # container (no user namespaces); disable it. Software-rendered
      # so the offscreen platform doesn't try to acquire a GL context.
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --disable-dev-shm-usage"
      QT_QUICK_BACKEND: software
      CCACHE_DIR: /cache/ccache
      CCACHE_MAXSIZE: 2G
      APT_ARCHIVES: /cache/apt/ubuntu26.04
      DEBIAN_FRONTEND: noninteractive
      # Node for the JavaScript actions (see header) and for the tests/js
      # suite, which runs `node --test`; pinned rather than the distro's.
      # cmake's `find_program(NODEJS …)` resolves to this one.
      # renovate: datasource=node-version depName=node
      NODE_VERSION: 24.22.2
    steps:
      - name: Install build + test deps and Node
        run: |
          set -eu
          for d in /cache/ccache /cache/apt /opt/hostedtoolcache; do
            mountpoint -q "$d" \
              || echo "::warning::$d is not mounted (runner container.valid_volumes?) — uncached"
          done
          # Keep downloaded .debs in the persistent cache instead of deleting
          # them after install (Ubuntu images ship docker-clean for that).
          rm -f /etc/apt/apt.conf.d/docker-clean
          # No fsync per unpacked file: the container is thrown away anyway, and
          # syncing only slows the install down.
          echo force-unsafe-io > /etc/dpkg/dpkg.cfg.d/90unsafe-io
          mkdir -p "$APT_ARCHIVES/partial" "$CCACHE_DIR"
          printf 'Dir::Cache::Archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\n' \
            "$APT_ARCHIVES" > /etc/apt/apt.conf.d/90persistent-cache
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git ca-certificates curl xz-utils \
            cmake extra-cmake-modules gettext ccache \
            libkf6wallet-dev libkf6kcmutils-dev libkf6coreaddons-dev \
            libkf6i18n-dev libkf6package-dev libplasma-dev \
            qt6-webengine-dev qt6-webengine-dev-tools \
            python3-dbusmock python3-dbus \
            appstream \
            xvfb
          # setup-node's tool-cache layout, so other jobs can reuse it.
          node_dir="/opt/hostedtoolcache/node/${NODE_VERSION}/x64"
          if ! [ -f "$node_dir.complete" ]; then
            # Unpack beside it and rename: a concurrent job never sees half a tree.
            tmp="$node_dir.tmp.$$"; mkdir -p "$tmp"
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
              | tar -xJ -C "$tmp" --strip-components=1
            rm -rf "$node_dir" && mv -T "$tmp" "$node_dir" && touch "$node_dir.complete"
          fi
          ln -sf "$node_dir"/bin/* /usr/local/bin/
          node --version
          # Drop .debs no longer in the indexes (superseded versions).
          apt-get autoclean -qq
          ccache --zero-stats

      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build build -j$(nproc)
          ccache --show-stats

      - name: Test
        run: ctest --test-dir build --output-on-failure --schedule-random -j$(nproc)

      - name: Upload CTest logs on failure
        if: failure()
        uses: forgejo/upload-artifact@v5
        with:
          name: ctest-logs
          path: build/Testing/
          if-no-files-found: ignore
