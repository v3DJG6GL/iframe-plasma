#
# Forgejo Actions CI (forgejo.informethic.ch). GitHub is a push mirror only:
# no workflows run there.
#
# Instance conventions (same as the other repos on this instance):
#   * Actions are referenced unqualified (owner/repo@ref): DEFAULT_ACTIONS_URL
#     points at this instance, so they resolve against its local pull mirrors
#     (org `actions`, `forgejo`). Before bumping an @version, confirm the
#     mirror has synced that tag. Actions without a local mirror use a full
#     https:// URL.
#   * upload-artifact comes from the Forgejo fork: GitHub's v4+ refuses
#     non-github.com instances, so never use actions/upload-artifact here.
#   * Container jobs: the runner executes JavaScript actions with the job
#     container's own `node`, so a container without Node must install it
#     before the first `uses:` step (see build-and-test).
#   * Download/compile cache: build-and-test and release.yml bind-mount
#     /persistent/iframe-plasma (on the runner's DinD host SSD, survives the
#     dind resets) at /cache:
#       /cache/ccache                ccache (CCACHE_DIR)
#       /cache/apt/<distro>          downloaded .debs (apt's archive dir)
#       /cache/node                  Node release tarballs
#     The runner config must list it, or the mount is dropped with the warning
#     "[/persistent/iframe-plasma] is not a valid volume, will be ignored" and
#     the job runs uncached (the first step then prints a ::warning::):
#       container:
#         valid_volumes:
#           - /persistent/iframe-plasma
#     The cache is writable by every repo on this runner; accepted, all of
#     them are the owner's. apt verifies cached .debs against the signed
#     indexes, so a tampered one is re-downloaded, not installed.
name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # pre-commit lints (whitespace, REUSE/SPDX compliance, shellcheck,
  # cmake-lint). qmllint runs in build-and-test where Qt is available.
  # -------------------------------------------------------------------
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: https://github.com/actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  # -------------------------------------------------------------------
  # Build the C++ plugin + the test suite against KDE Neon's bleeding
  # edge Plasma 6 image, then run every CTest target headless.
  #
  # kdeneon/plasma:unstable is the only mainstream image that ships a
  # working combination of Qt 6.7+, KF6, plasma-workspace and qt6-
  # webengine-dev. Pinned by content digest so upstream image churn
  # can't break CI silently — Renovate bumps the digest.
  # -------------------------------------------------------------------
  build-and-test:
    name: Build + test (kdeneon/plasma)
    runs-on: ubuntu-latest
    container:
      image: kdeneon/plasma@sha256:4acf25665f68afc71bfdbca6c6c775664f78af23f6b3965c5759e37521e85e5c
      options: --user 0:0 --security-opt apparmor=unconfined
      volumes:
        - /persistent/iframe-plasma:/cache
    env:
      QT_QPA_PLATFORM: offscreen
      # WebEngine can't use Chromium's setuid sandbox inside the
      # container (no user namespaces); disable it. Software-rendered
      # so the offscreen platform doesn't try to acquire a GL context.
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --disable-dev-shm-usage"
      QT_QUICK_BACKEND: software
      CCACHE_DIR: /cache/ccache
      CCACHE_MAXSIZE: 2G
      APT_ARCHIVES: /cache/apt/kdeneon
      DEBIAN_FRONTEND: noninteractive
      # Node for the JavaScript actions (see header) and for the tests/js
      # suite, which runs `node --test` (Node 18+; jammy/neon ship 12.22).
      # cmake's `find_program(NODEJS …)` resolves to this one.
      # renovate: datasource=node-version depName=node
      NODE_VERSION: 24.21.0
    steps:
      - name: Install build + test deps and Node
        # `full-upgrade` first: the pinned kdeneon/plasma image carries
        # libgpgmepp6 1.16 / libharfbuzz0b 2.7 / libgdk-pixbuf 2.36 from
        # jammy main, but neon's unstable repo has since moved kf6-kwallet
        # and friends to libgpgmepp6 >= 1.23, harfbuzz 6.x, etc.  Without
        # a full upgrade, the targeted `apt-get install` below hits
        # "unmet dependencies: kf6-kwallet : Depends: libgpgmepp6 (>= 1.23.2)
        # but 1.16.0-1.2ubuntu4.2 is to be installed" and exits 100 before
        # CMake ever runs.
        #
        # `--allow-downgrades` on the install step: after the full-upgrade,
        # harfbuzz0b / libjpeg-turbo8 / libraqm0 are at neon-unstable's
        # newer rebase, but jammy-main's `libharfbuzz-dev` / `libjpeg-dev`
        # (pulled in transitively by qt6-webengine-dev) depend on the older
        # versions, so apt wants to step those runtime libs back down.
        run: |
          set -eu
          mountpoint -q /cache \
            || echo "::warning::/persistent/iframe-plasma not mounted (runner valid_volumes?) — running uncached"
          # Keep downloaded .debs in the persistent cache instead of deleting
          # them after install (Ubuntu images ship docker-clean for that).
          rm -f /etc/apt/apt.conf.d/docker-clean
          mkdir -p "$APT_ARCHIVES/partial" /cache/node "$CCACHE_DIR"
          printf 'Dir::Cache::Archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\n' \
            "$APT_ARCHIVES" > /etc/apt/apt.conf.d/90persistent-cache
          apt-get update
          apt-get -y full-upgrade
          apt-get install -y --no-install-recommends --allow-downgrades \
            build-essential git ca-certificates curl xz-utils \
            cmake extra-cmake-modules gettext ccache \
            libkf6wallet-dev libkf6kcmutils-dev libkf6coreaddons-dev \
            libkf6i18n-dev libkf6package-dev libplasma-dev \
            qt6-webengine-dev qt6-webengine-dev-tools \
            python3-dbusmock python3-dbus \
            xvfb
          node_tar="/cache/node/node-v${NODE_VERSION}-linux-x64.tar.xz"
          if ! [ -s "$node_tar" ]; then
            curl -fsSL -o "$node_tar.part" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
            mv "$node_tar.part" "$node_tar"
          fi
          tar -xJf "$node_tar" -C /usr/local --strip-components=1
          node --version
          # Drop .debs no longer in the indexes (superseded versions).
          apt-get autoclean -qq
          ccache --zero-stats

      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build build -j$(nproc)
          ccache --show-stats

      - name: Test
        run: ctest --test-dir build --output-on-failure --schedule-random -j$(nproc)

      - name: Upload CTest logs on failure
        if: failure()
        uses: forgejo/upload-artifact@v5
        with:
          name: ctest-logs
          path: build/Testing/
          if-no-files-found: ignore
